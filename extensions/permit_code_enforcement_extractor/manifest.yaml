id: permit_code_enforcement_extractor
name: "Permit Code Enforcement Extractor"
version: "1.0.0"
description: "Stage-2 dependent DAG extractor isolating open and closed municipal code-enforcement cases strictly from upstream DOMAIN_PERMITS records."
domain: permit_intel
domains:
  - permit_intel
driver: native_adapter
proto_message_type: "openestate.extension.v1.CodeEnforcementIntelProto"
priority: 420
enabled_by_default: true
tier: basic
license_class: public_open_data
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
builtin: true
provenance: live_verified
depends_on:
  - campbell_mgo_permits
  - municipal_open_data_permits
  - shovels_permits
input_from_domains:
  - permits
upstream_require_mode: any
homepage_url: "https://www.campbellca.gov/134/Code-Enforcement"
documentation_url: "https://www.iccsafe.org/"
codeowners:
  - "@openestate/permits"
geo_scope:
  country: "US"
  nationwide: true
  states: []
auth:
  auth_type: none
rate_limit:
  requests_per_second: 50
  burst: 100
  timeout_ms: 1000
  max_retries: 0
cache_ttl_secs: 86400
source_attribution:
  name: "Stage-2 Code Enforcement Extractor"
  url: "https://www.campbellca.gov/134/Code-Enforcement"
  reference_url_template: "https://www.campbellca.gov/134/Code-Enforcement"
  notes: "Skipped cleanly if all Stage-1 permit fetchers fail or are disabled."

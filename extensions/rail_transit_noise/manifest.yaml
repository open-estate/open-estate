id: rail_transit_noise
name: "FRA / FTA Rail Schedules, Quiet Zones & Wayside Horn Noise"
version: "1.0.0"
description: "Keyless USDOT BTS / FRA Grade Crossing Inventory day/night train schedules and 49 CFR 222 Quiet Zone horn bans, North American Rail Network lines, National Transit Map rail/bus routes, and FTA wayside Ldn plus crossing horn impulse Lmax."
domain: environmental
domains:
  - environmental
  - livability
driver: native_adapter
proto_message_type: "openestate.extension.v1.EnvironmentalSummaryProto"
priority: 236
enabled_by_default: true
tier: basic
license_class: public_open_data
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
    - external_api_calls
    - bytes_downloaded
builtin: true
provenance: live_verified
homepage_url: "https://www.bts.gov/national-transit-map"
documentation_url: "https://maps.dot.gov/BTS/NationalTransportationNoiseMap/"
codeowners:
  - "@openestate/core"
geo_scope:
  country: "US"
  nationwide: true
  states: []
  counties: []
  zip_prefixes: []
  zip_codes: []
  cities: []
auth:
  auth_type: none
rate_limit:
  requests_per_second: 4
  burst: 8
  timeout_ms: 8500
  max_retries: 1
cache_ttl_secs: 604800
sharing:
  scope: geohash6
  ttl_secs: 604800
  stale_while_revalidate_secs: 86400
  background_refresh: false
source_attribution:
  name: "USDOT FRA Grade Crossing Inventory, North American Rail Network & National Transit Map"
  url: "https://www.bts.gov/national-transit-map"
  reference_url_template: "https://www.bts.gov/national-transit-map"

id: us_natural_gas
name: "US Natural Gas & Residential Heating Fuel Tariffs"
version: "1.0.0"
description: "Published residential natural gas $/therm rate schedules, monthly meter base fees, and all-electric heat-pump regional standards across US utilities."
domain: gas_utility
domains:
  - gas_utility
driver: declarative_yaml
proto_message_type: "openestate.extension.v1.GasUtilityProto"
priority: 120
enabled_by_default: true
provenance: unverified
homepage_url: "https://www.eia.gov/dnav/ng/ng_pri_sum_a_epg0_prs_dmcf_m.htm"
documentation_url: "https://www.eia.gov/naturalgas/"
codeowners:
  - "@openestate/utilities"
geo_scope:
  country: "US"
  nationwide: true
  states: []
auth:
  auth_type: none
cache_ttl_secs: 604800
source_attribution:
  name: "State PUC & US EIA Published Residential Natural Gas Tariffs"
  url: "https://www.eia.gov/dnav/ng/ng_pri_sum_a_epg0_prs_dmcf_m.htm"
tariff_catalog:

id: us_municipal_electric
name: "US Municipal Public Power & PUD Tariff Catalog"
version: "1.0.0"
description: "Published residential electric rate schedules, time-of-use tiers, monthly customer charges, and municipal solar net-metering policies for US municipal utilities and Public Utility Districts."
domain: electric_utility
domains:
  - electric_utility
driver: declarative_yaml
proto_message_type: "openestate.extension.v1.ElectricUtilityProto"
priority: 280
enabled_by_default: true
tier: basic
license_class: public_open_data
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
provenance: official_tariff
homepage_url: "https://www.publicpower.org/"
documentation_url: "https://www.eia.gov/electricity/state/"
codeowners:
  - "@openestate/utilities"
geo_scope:
  country: "US"
  states: ["CA", "TX", "WA", "FL", "AZ", "AK", "TN"]
auth:
  auth_type: none
cache_ttl_secs: 604800
source_attribution:
  name: "Published Municipal Electric Utility Residential Tariffs"
  url: "https://www.publicpower.org/"
  reference_url_template: "https://www.publicpower.org/"
tariff_catalog:
  electric_rules:

id: us_fiber_carriers
name: "US Symmetrical Fiber-to-the-Home (FTTH) Carrier Footprints"
version: "1.0.0"
description: "Published metro & county service territories, symmetrical multi-gigabit FTTH speeds, plan pricing tiers, and address-check links for major US fiber carriers (supplementing live FCC BDC queries)."
domain: broadband
domains:
  - broadband
driver: declarative_yaml
proto_message_type: "openestate.extension.v1.BroadbandCatalogProto"
priority: 120
enabled_by_default: true
provenance: unverified
homepage_url: "https://broadbandmap.fcc.gov/"
documentation_url: "https://broadbandmap.fcc.gov/"
codeowners:
  - "@openestate/broadband"
geo_scope:
  country: "US"
  nationwide: true
  states: []
auth:
  auth_type: none
cache_ttl_secs: 604800
source_attribution:
  name: "Published FTTH Fiber Carrier Metro Service Footprints"
  url: "https://broadbandmap.fcc.gov/"
footprint_catalog:
  broadband_rules:

      exclude_rural: true
      geo_scope:
        states: ["CA"]
        counties: ["06085", "06075", "06001", "06081", "06013", "06041"]
      carrier_name: "Sonic 10G Fiber"
      technology: "Fiber (FTTH)"
      tier_category: "fiber"
      max_download_mbps: 10000
      max_upload_mbps: 10000
      symmetrical: true
      typical_monthly_usd: "$49.99/mo (up to 10 Gbps symmetrical)"
      availability_status: "regional_footprint_unverified"
      check_url: "https://www.sonic.com/"


id: us_cable_wireless_isp
name: "US Cable DOCSIS, 5G Fixed Wireless & LEO Satellite Footprints"
version: "1.0.0"
description: "Published service territories, DOCSIS 3.1/4.0 cable tiers, 5G Fixed Wireless, and nationwide Starlink LEO satellite plans."
domain: broadband
domains:
  - broadband
driver: declarative_yaml
proto_message_type: "openestate.extension.v1.BroadbandCatalogProto"
priority: 120
enabled_by_default: true
tier: basic
license_class: public_open_data
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
provenance: unverified
homepage_url: "https://broadbandmap.fcc.gov/"
documentation_url: "https://broadbandmap.fcc.gov/"
codeowners:
  - "@openestate/broadband"
geo_scope:
  country: "US"
  nationwide: true
  states: []
auth:
  auth_type: none
cache_ttl_secs: 604800
source_attribution:
  name: "Published Cable DOCSIS, 5G Fixed Wireless & LEO Satellite Footprints"
  url: "https://broadbandmap.fcc.gov/"
footprint_catalog:
  broadband_rules:
    - id: xfinity_norcal
      exclude_rural: true
      geo_scope:
        states: ["CA"]
        counties: ["06085", "06075", "06001", "06081", "06013", "06041", "06087", "06067", "06061"]
      carrier_name: "Xfinity (Comcast)"
      technology: "Cable (DOCSIS 3.1/4.0)"
      tier_category: "cable"
      max_download_mbps: 2000
      max_upload_mbps: 200
      symmetrical: false
      typical_monthly_usd: "$65–$115/mo (400M–2Gbps DOCSIS)"
      availability_status: "regional_footprint_unverified"
      check_url: "https://www.xfinity.com/learn/internet-service"

    - id: cox_spectrum_oc_sd
      exclude_rural: true
      geo_scope:
        states: ["CA"]
        counties: ["06059", "06073"]

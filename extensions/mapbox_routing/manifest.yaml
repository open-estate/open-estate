id: mapbox_routing
name: "Mapbox Directions Matrix API"
version: "1.0.0"
description: "Tier-2 cloud driving matrix fallback via Mapbox Directions Matrix API v1 (traffic-aware typical driving speeds; max 25 coordinates per request)."
domain: routing
driver: openapi_yaml
proto_message_type: "openestate.extension.v1.RoutingMatrixProto"
priority: 120
enabled_by_default: true
provenance: live_verified
homepage_url: "https://www.mapbox.com/"
documentation_url: "https://docs.mapbox.com/api/navigation/matrix/"
codeowners:
  - "@openestate/core"
geo_scope:
  country: "US"
  nationwide: true
auth:
  type: api_key_query
  query_param: "access_token"
  env_var: "MAPBOX_ACCESS_TOKEN"
  optional_key: true
rate_limit:
  requests_per_second: 10
  burst: 20
  timeout_ms: 4500
  max_retries: 0
cache_ttl_secs: 604800
source_attribution:
  name: "Mapbox Directions Matrix · © OpenStreetMap"
  url: "https://docs.mapbox.com/api/navigation/matrix/"
openapi:
  spec_file: "openapi.yaml"
  operation_id: "getMapboxDrivingMatrix"
response_mapping:
  root_path: "$"
  require_non_empty: true
  fields:
    sample_duration_sec: "$.durations[0][1]"
    sample_distance_m: "$.distances[0][1]"

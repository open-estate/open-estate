id: nws_weather
name: "NOAA / NWS Live Weather, Alerts & Radar Station"
version: "1.0.0"
description: "Keyless NOAA National Weather Service (api.weather.gov) gridpoint 7-day forecast, active weather alerts, nearest ASOS/METAR observation, and serving NEXRAD radar station."
domain: natural_hazards
domains:
  - natural_hazards
driver: native_adapter
proto_message_type: "openestate.extension.v1.HazardSummaryProto"
priority: 225
enabled_by_default: true
tier: basic
license_class: public_open_data
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
    - external_api_calls
    - bytes_downloaded
builtin: true
provenance: live_verified
homepage_url: "https://www.weather.gov/"
documentation_url: "https://www.weather.gov/documentation/services-web-api"
codeowners:
  - "@openestate/core"
geo_scope:
  country: "US"
  nationwide: true
  states: []
  counties: []
  zip_prefixes: []
  zip_codes: []
  cities: []
auth:
  auth_type: none
rate_limit:
  requests_per_second: 4
  burst: 8
  timeout_ms: 8000
  max_retries: 1
cache_ttl_secs: 1800
sharing:
  scope: geohash5
  ttl_secs: 1800
  stale_while_revalidate_secs: 900
  background_refresh: false
source_attribution:
  name: "NOAA / National Weather Service (api.weather.gov)"
  url: "https://api.weather.gov/"
  reference_url_template: "https://forecast.weather.gov/MapClick.php?lat={{lat}}&lon={{lon}}"

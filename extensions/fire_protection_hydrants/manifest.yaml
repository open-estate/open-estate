id: fire_protection_hydrants
name: "FEMA RAPT / USGS Fire Stations, Hydrants & ISO PPC Insurability"
version: "1.0.0"
description: "Screens fire-suppression infrastructure and wildfire/roof insurability from FEMA RAPT / HIFLD Fire Stations, USGS National Map Structures, and OpenStreetMap fire hydrants — computing an ISO Public Protection Class (PPC 1–10) proxy, 1,000-ft hydrant and municipal water verification, 3DEP LiDAR roof-canopy overhang risk, and reroof permit carrier cliff checks."
domain: insurance
domains:
  - insurance
  - natural_hazards
  - livability
driver: native_adapter
proto_message_type: "openestate.extension.v1.InsuranceQuoteProto"
priority: 260
enabled_by_default: true
tier: basic
license_class: public_open_data
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
    - external_api_calls
    - bytes_downloaded
builtin: true
provenance: live_verified
homepage_url: "https://www.fema.gov/emergency-managers/practitioners/resilience-analysis-and-planning-tool"
documentation_url: "https://www.usgs.gov/programs/national-geospatial-program/national-map"
codeowners:
  - "@openestate/core"
geo_scope:
  country: "US"
  nationwide: true
  states: []
  counties: []
  zip_prefixes: []
  zip_codes: []
  cities: []
auth:
  auth_type: none
rate_limit:
  requests_per_second: 5
  burst: 10
  timeout_ms: 8000
  max_retries: 1
cache_ttl_secs: 604800
sharing:
  scope: geohash6
  ttl_secs: 2592000
  stale_while_revalidate_secs: 604800
  background_refresh: false
source_attribution:
  name: "FEMA RAPT / HIFLD Fire Stations, USGS National Map Structures & OpenStreetMap Contributors (ODbL)"
  url: "https://www.fema.gov/emergency-managers/practitioners/resilience-analysis-and-planning-tool"
  reference_url_template: "https://www.openstreetmap.org/?mlat={{lat}}&mlon={{lon}}#map=16/{{lat}}/{{lon}}"
  schedule_or_version: "FEMA Critical Infrastructure Layer 12 + USGS Structures Layer 16 + OSM Hydrants"
  notes: "Estimates an open-data ISO Public Protection Class (PPC 1–10) proxy from verified fire-station distance and 1,000-ft hydrant or municipal water availability; never claims a proprietary Verisk/ISO commercial rating filing."

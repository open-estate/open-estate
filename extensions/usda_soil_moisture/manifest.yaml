id: usda_soil_moisture
name: "USDA NRCS SSURGO Soil Drainage, Shrink-Swell, Water Table, NWM Moisture & Drought"
version: "1.0.0"
description: "Dual-hedged USDA NRCS Soil Data Access (SSURGO) and USDA-NRCS / UC Davis Cooperative SoilWeb foundation soil profile (drainage class, hydrologic group, seasonal high water table, expansive clay LEP %, percolation Ksat, corrosion, basement/slab/infiltration suitability), NASA POWER seasonal soil wetness, NOAA National Water Model 1km live saturation, and US Drought Monitor / CPC Drought Outlook."
domain: natural_hazards
domains:
  - natural_hazards
  - environmental
driver: native_adapter
proto_message_type: "openestate.extension.v1.HazardSummaryProto"
priority: 220
enabled_by_default: true
tier: basic
license_class: public_open_data
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
    - external_api_calls
    - bytes_downloaded
builtin: true
provenance: live_verified
homepage_url: "https://websoilsurvey.nrcs.usda.gov/"
documentation_url: "https://sdmdataaccess.sc.egov.usda.gov/"
codeowners:
  - "@openestate/core"
geo_scope:
  country: "US"
  nationwide: true
  states: []
  counties: []
  zip_prefixes: []
  zip_codes: []
  cities: []
auth:
  auth_type: none
rate_limit:
  requests_per_second: 4
  burst: 8
  timeout_ms: 9000
  max_retries: 1
cache_ttl_secs: 86400
sharing:
  scope: geohash7
  ttl_secs: 86400
  stale_while_revalidate_secs: 14400
  background_refresh: false
source_attribution:
  name: "USDA NRCS SSURGO / UC Davis SoilWeb / NOAA NWM / US Drought Monitor"
  url: "https://websoilsurvey.nrcs.usda.gov/"
  reference_url_template: "https://casoilresource.lawr.ucdavis.edu/gmap/?loc={{lat}},{{lon}},z17"

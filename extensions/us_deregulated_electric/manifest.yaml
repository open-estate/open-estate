id: us_deregulated_electric
name: "US Deregulated Retail Choice Electric Tariffs (ERCOT / PJM)"
version: "1.0.0"
description: "Published Transmission & Distribution Utility (TDU/EDC) + Competitive Retail Electric benchmark schedules for ERCOT Texas, Pennsylvania Power Switch, and Ohio Energy Choice territories."
domain: electric_utility
domains:
  - electric_utility
driver: declarative_yaml
proto_message_type: "openestate.extension.v1.ElectricUtilityProto"
priority: 210
enabled_by_default: true
tier: basic
license_class: public_open_data
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
provenance: official_tariff
homepage_url: "https://www.powertochoose.org/"
documentation_url: "https://www.eia.gov/electricity/state/"
codeowners:
  - "@openestate/utilities"
geo_scope:
  country: "US"
  states: ["TX", "PA", "OH"]
auth:
  auth_type: none
cache_ttl_secs: 604800
source_attribution:
  name: "PUCT PowerToChoose / PA Power Switch / PUCO Energy Choice Published Benchmarks"
  url: "https://www.powertochoose.org/"
  reference_url_template: "https://www.powertochoose.org/"
tariff_catalog:
  electric_rules:

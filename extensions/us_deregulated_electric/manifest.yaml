      geo_scope:
        states: ["TX"]
        counties: ["48201", "48157", "48039", "48167"]
        cities: ["houston", "katy", "sugar land", "pearland", "pasadena", "league city"]
      carrier_name: "CenterPoint Energy (TDU) + ERCOT Retail Choice"
      short_name: "CenterPoint + ERCOT Choice"
      utility_type: "deregulated_choice"
      rate_schedule: "12-Mo Fixed Retail Electric Plan (TXU / Octopus / Rhythm / Reliant)"
      rate_per_kwh_usd: 0.159
      off_peak_kwh_usd: 0.142
      peak_kwh_usd: 0.178
      monthly_base_fee_usd: 4.39
      solar_nem_policy: "Retail Solar Buyback Plan (select REP with 1:1 or RTW export credit)"
      tariff_url: "https://www.powertochoose.org/"
      rate_source: "PUCT PowerToChoose Houston CenterPoint 1,000 kWh Benchmark"

    - id: oncor_ercot_texas
      geo_scope:

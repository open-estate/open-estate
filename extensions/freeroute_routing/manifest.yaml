id: freeroute_routing
name: "FreeRoute Matrix API"
version: "1.0.0"
description: "Tier-2 cloud driving matrix fallback via FreeRoute Matrix API v1 on OpenStreetMap road network data (max 25 coordinates per request)."
domain: routing
driver: openapi_yaml
proto_message_type: "openestate.extension.v1.RoutingMatrixProto"
priority: 110
enabled_by_default: true
provenance: live_verified
homepage_url: "https://maps.freeroute.org"
documentation_url: "https://maps.freeroute.org"
codeowners:
  - "@openestate/core"
geo_scope:
  country: "US"
  nationwide: true
auth:
  type: bearer_token
  header_name: "Authorization"
  header_prefix: "Bearer "
  env_var: "FREEROUTE_API_KEY"
  optional_key: true
rate_limit:
  requests_per_second: 5
  burst: 10
  timeout_ms: 4500
  max_retries: 0
cache_ttl_secs: 604800
source_attribution:
  name: "FreeRoute Matrix API · © OpenStreetMap"
  url: "https://maps.freeroute.org"
openapi:
  spec_file: "openapi.yaml"
  operation_id: "postFreeRouteDrivingMatrix"
  body_template: '{"locations":[[{{ lon }},{{ lat }}],[{{ lon }},{{ lat }}]],"sources":[0],"destinations":[1],"metrics":["duration","distance"]}'
response_mapping:
  root_path: "$"
  require_non_empty: true
  fields:
    sample_duration_sec: "$.durations[0][1]"
    sample_distance_m: "$.distances[0][1]"

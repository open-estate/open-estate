id: military_airspace_noise
name: "FAA Special Use Airspace Schedules, MTR Corridors & DoD Airfields"
version: "1.0.0"
description: "Keyless FAA Special Use Airspace (SUA) polygons with TIMESOFUSE active schedules, Military Training Route (MTR) low-level jet corridors, DoD national security airspace, NTAD military installations, and AICUZ / MR_NMAP acoustic screening."
domain: environmental
domains:
  - environmental
  - livability
driver: native_adapter
proto_message_type: "openestate.extension.v1.EnvironmentalSummaryProto"
priority: 234
enabled_by_default: true
tier: basic
license_class: public_open_data
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
    - external_api_calls
    - bytes_downloaded
builtin: true
provenance: live_verified
homepage_url: "https://www.faa.gov/air_traffic/flight_info/aeronav/aero_data/"
documentation_url: "https://sua.faa.gov/"
codeowners:
  - "@openestate/core"
geo_scope:
  country: "US"
  nationwide: true
  states: []
  counties: []
  zip_prefixes: []
  zip_codes: []
  cities: []
auth:
  auth_type: none
rate_limit:
  requests_per_second: 4
  burst: 8
  timeout_ms: 8500
  max_retries: 1
cache_ttl_secs: 604800
sharing:
  scope: geohash5
  ttl_secs: 604800
  stale_while_revalidate_secs: 86400
  background_refresh: false
source_attribution:
  name: "FAA Special Use Airspace (SUA), Military Training Routes (MTR) & NTAD Military Bases"
  url: "https://www.faa.gov/air_traffic/flight_info/aeronav/aero_data/"
  reference_url_template: "https://www.faa.gov/air_traffic/flight_info/aeronav/aero_data/"

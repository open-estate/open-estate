id: pipeline_row_easements
name: "Pipeline & High-Voltage ROW Easements & Buildable Yard"
version: "1.0.0"
description: "Keyless DHS/FEMA HIFLD transmission pipelines (natural gas, petroleum products, crude oil, HGL) and high-voltage bulk electric transmission ROW clearance screening, PHMSA 200m/660ft consultation & 30m/100ft ROW easement flags, FHA/HUD 45m/150ft fall-zone screening, and LiDAR slope-adjusted net flat buildable yard sizing."
domain: property_facts
domains:
  - property_facts
  - environmental
  - natural_hazards
  - house_3d
driver: native_adapter
proto_message_type: "openestate.extension.v1.PropertyFactsProto"
priority: 235
enabled_by_default: true
tier: basic
license_class: public_open_data
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
    - external_api_calls
    - bytes_downloaded
builtin: true
provenance: live_verified
homepage_url: "https://www.phmsa.dot.gov/pipeline/national-pipeline-mapping-system-npms"
documentation_url: "https://www.npms.phmsa.dot.gov/"
codeowners:
  - "@openestate/property-facts"
geo_scope:
  country: "US"
  nationwide: true
  states: []
  counties: []
  zip_prefixes: []
  zip_codes: []
  cities: []
auth:
  auth_type: none
rate_limit:
  requests_per_second: 5
  burst: 10
  timeout_ms: 8500
  max_retries: 1
cache_ttl_secs: 2592000
sharing:
  scope: geohash6
  ttl_secs: 2592000
  stale_while_revalidate_secs: 604800
  background_refresh: false
source_attribution:
  name: "U.S. DOT PHMSA NPMS / DHS FEMA HIFLD Infrastructure Foundation-Level Data"
  url: "https://www.npms.phmsa.dot.gov/"
  reference_url_template: "https://www.npms.phmsa.dot.gov/PublicViewer/"

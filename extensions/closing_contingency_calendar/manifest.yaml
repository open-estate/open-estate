id: closing_contingency_calendar
name: "50-State Cash-to-Close, Prorations & Contingency Milestone Calendar"
version: "1.0.0"
description: "Itemized Cash-to-Close engine wiring statutory/filed title premiums from title_underwriter_rates, city/county transfer & mortgage recording tax buyer/seller splits, property-tax/insurance proration, CA Prop 13 supplemental tax reserve, HOA resale/transfer fees, Year-1 CapEx reserve, and a 50-state + DC earnest money & TRID contingency milestone calendar."
domain: tax_mandates
domains:
  - tax_mandates
  - insurance
driver: native_adapter
proto_message_type: "openestate.extension.v1.TaxMandatesProto"
priority: 255
enabled_by_default: true
tier: basic
license_class: public_open_data
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
    - external_api_calls
    - bytes_downloaded
builtin: true
provenance: official_tariff
depends_on:
  - title_underwriter_rates
input_from_domains:
  - insurance
upstream_require_mode: any
homepage_url: "https://www.consumerfinance.gov/owning-a-home/closing-disclosure/"
documentation_url: "https://www.consumerfinance.gov/compliance/compliance-resources/mortgage-resources/tila-respa-integrated-disclosures/"
codeowners:
  - "@openestate/core"
geo_scope:
  country: "US"
  nationwide: true
  states: []
  counties: []
  zip_prefixes: []
  zip_codes: []
  cities: []
auth:
  auth_type: none
rate_limit:
  requests_per_second: 50
  burst: 100
  timeout_ms: 2000
  max_retries: 0
cache_ttl_secs: 604800
sharing:
  scope: parcel
  ttl_secs: 604800
  stale_while_revalidate_secs: 86400
  background_refresh: false
source_attribution:
  name: "CFPB TRID Closing Disclosure Rules, State Title Rate Filings & County Transfer Tax Schedules"
  url: "https://www.consumerfinance.gov/owning-a-home/closing-disclosure/"
  reference_url_template: "https://www.consumerfinance.gov/owning-a-home/closing-disclosure/"
  schedule_or_version: "12 CFR § 1026.19(f) TRID + 2025–2026 State Title & Transfer Tax Schedules"
  notes: "Replaces flat percentage title heuristics with promulgated/filed underwriter tariffs and never fabricates dollar figures when purchase price is absent."

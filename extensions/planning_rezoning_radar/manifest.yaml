id: planning_rezoning_radar
name: "Municipal Planning, FTA TOD Upzoning & Quarter-Mile Construction Radar"
version: "1.1.0"
description: "Native TOD & infill radar combining keyless US DOT BTS/FTA NTAD National Transit Map stops, Amtrak stations, nearby municipal permit signals (18–805 m), Overpass construction footprints, 0.50-mi statutory TOD upzoning triggers (CA AB 2097/SB 79/SB 9, WA HB 1110, MA MBTA 3A, CO HB 24-1313), and the tod-transit-stops GeoJSON map layer."
domain: livability
domains:
  - livability
  - property_facts
driver: native_adapter
proto_message_type: "openestate.extension.v1.LivabilitySummaryProto"
priority: 255
enabled_by_default: true
tier: basic
license_class: public_open_data
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
    - external_api_calls
    - bytes_downloaded
builtin: true
provenance: live_verified
homepage_url: "https://www.bts.gov/ntad"
documentation_url: "https://geodata.bts.gov/"
codeowners:
  - "@openestate/planning"
geo_scope:
  country: "US"
  nationwide: true
  states: []
  counties: []
  zip_prefixes: []
  zip_codes: []
  cities: []
auth:
  auth_type: none
rate_limit:
  requests_per_second: 5
  burst: 10
  timeout_ms: 8000
  max_retries: 1
cache_ttl_secs: 86400
sharing:
  scope: geohash6
  ttl_secs: 86400
  stale_while_revalidate_secs: 21600
  background_refresh: true
source_attribution:
  name: "US DOT BTS / FTA National Transit Map, Amtrak NTAD & OpenStreetMap Construction Radar"
  url: "https://www.bts.gov/ntad"
  reference_url_template: "https://www.openstreetmap.org/#map=16/{{lat}}/{{lon}}"
  schedule_or_version: "BTS NTAD Live FeatureServer + ODbL Construction/Proposed Ways"
  notes: "Queries keyless NTAD_National_Transit_Map_Stops, NTAD_Amtrak_Stations, and hedged Overpass construction ways within 0.50 miles (805 m); never calls token-gated National_Transit_Map_Stops and never fabricates unmapped projects."

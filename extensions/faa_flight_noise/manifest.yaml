id: faa_flight_noise
name: "FAA Flight Paths, Runways & Live Aviation Noise"
version: "1.0.0"
description: "Keyless FAA Aeronautical Information Services (AIS) airports and Class B/C/D airspace shelves, USDOT BTS runway-end alignments and ILS glidepaths, live ADS-B overflight traffic, and FAA AEDT screening Ldn/Lmax with 10-mile approach/departure corridor geometries."
domain: environmental
domains:
  - environmental
  - livability
driver: native_adapter
proto_message_type: "openestate.extension.v1.EnvironmentalSummaryProto"
priority: 240
enabled_by_default: true
tier: basic
license_class: public_open_data
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
    - external_api_calls
    - bytes_downloaded
builtin: true
provenance: live_verified
homepage_url: "https://www.faa.gov/air_traffic/flight_info/aeronav/aero_data/"
documentation_url: "https://maps.dot.gov/BTS/NationalTransportationNoiseMap/"
codeowners:
  - "@openestate/core"
geo_scope:
  country: "US"
  nationwide: true
  states: []
  counties: []
  zip_prefixes: []
  zip_codes: []
  cities: []
auth:
  auth_type: none
rate_limit:
  requests_per_second: 4
  burst: 8
  timeout_ms: 8500
  max_retries: 1
cache_ttl_secs: 300
sharing:
  scope: geohash5
  ttl_secs: 300
  stale_while_revalidate_secs: 900
  background_refresh: false
source_attribution:
  name: "FAA Aeronautical Information Services (AIS), USDOT BTS Runway Ends & Live ADS-B"
  url: "https://www.faa.gov/air_traffic/flight_info/aeronav/aero_data/"
  reference_url_template: "https://maps.dot.gov/BTS/NationalTransportationNoiseMap/"

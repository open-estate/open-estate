description: "Registered FCC Antenna Structure Registration (ASR) towers, DHS HIFLD FCC ULS cellular licensee sites, and FAA Digital Obstacle File vertical structures within 1.0 mile, with strict zero-PII stripping of natural-person contact fields and the fcc-cell-towers GeoJSON map layer."

id: locationiq_routing
name: "LocationIQ Matrix API"
version: "1.0.0"
description: "Tier-2 cloud driving matrix fallback via LocationIQ Matrix API v1 on OpenStreetMap road network data (max 25 coordinates per request, 2 RPS rate limit)."
domain: routing
driver: openapi_yaml
proto_message_type: "openestate.extension.v1.RoutingMatrixProto"
priority: 115
enabled_by_default: true
tier: basic
license_class: byok_commercial_api
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
    - external_api_calls
    - bytes_downloaded
provenance: live_verified
homepage_url: "https://locationiq.com/"
documentation_url: "https://docs.locationiq.com/reference/matrix"
codeowners:
  - "@openestate/core"
geo_scope:
  country: "US"
  nationwide: true
auth:
  type: api_key_query
  query_param: "key"
  env_var: "LOCATIONIQ_API_KEY"
  optional_key: true
rate_limit:
  requests_per_second: 2
  burst: 2
  timeout_ms: 4500
  max_retries: 0
cache_ttl_secs: 604800
sharing:
  scope: geohash7
  ttl_secs: 2592000
  stale_while_revalidate_secs: 86400
  background_refresh: false
  key_fields:
    - "extra_params.profile"
source_attribution:
  name: "LocationIQ Matrix · © OpenStreetMap"
  url: "https://docs.locationiq.com/reference/matrix"
  reference_url_template: "https://docs.locationiq.com/reference/matrix"
openapi:
  spec_file: "openapi.yaml"
  operation_id: "getLocationIqDrivingMatrix"
response_mapping:
  root_path: "$"
  require_non_empty: true
  fields:
    sample_duration_sec: "$.durations[0][1]"
    sample_distance_m: "$.distances[0][1]"

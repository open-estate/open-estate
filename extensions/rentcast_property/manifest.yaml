id: rentcast_property
name: "RentCast US Property Records & Valuation (BYOK)"
version: "1.0.0"
description: "Nationwide US parcel structural characteristics, assessor APN, zoning, and sale history via RentCast v1 OpenAPI (active when RENTCAST_API_KEY is configured; zero owner PII extracted)."
domain: property_facts
domains:
  - property_facts
  - valuation
driver: openapi_yaml
proto_message_type: "openestate.extension.v1.PropertyFactsProto"
priority: 220
enabled_by_default: true
provenance: live_verified
homepage_url: "https://developers.rentcast.io/"
documentation_url: "https://developers.rentcast.io/reference/property-records"
codeowners:
  - "@openestate/core"
geo_scope:
  country: "US"
  nationwide: true
  states: []
  counties: []
  zip_prefixes: []
  zip_codes: []
  cities: []
auth:
  auth_type: api_key_header
  env_var: "RENTCAST_API_KEY"
  header_name: "X-Api-Key"
  optional_key: true
rate_limit:
  requests_per_second: 5
  burst: 10
  timeout_ms: 12000
cache_ttl_secs: 86400
source_attribution:
  name: "RentCast US Property & Assessor Records API"
  url: "https://api.rentcast.io/v1/properties"
openapi:
  spec_file: "openapi.yaml"
  operation_id: "getPropertyRecordByAddress"
  query_params:
    address: "{{ address }}"
response_mapping:
  root_path: "$[0]"
  require_non_empty: true
  fields:
    property_type: "$.propertyType"
    beds: "$.bedrooms"
    baths: "$.bathrooms"
    sqft: "$.squareFootage"
    lot_sqft: "$.lotSize"
    year_built: "$.yearBuilt"
    stories: "$.features.floorCount"
    apn: "$.assessorID"
    zoning: "$.zoning"
    last_sale_price_usd: "$.lastSalePrice"
    last_sale_date: "$.lastSaleDate"

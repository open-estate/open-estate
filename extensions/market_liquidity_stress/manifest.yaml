id: market_liquidity_stress
name: "Freddie Mac PMMS Rate Shock Matrix & Price-Tier Liquidity Segmentation"
version: "1.0.0"
description: "Keyless Freddie Mac PMMS direct CSV + 2026 FHFA county loan-limit analyzer computing a 5-step Rate Shock Matrix (-1.0%, base, +0.5%, +1.0%, +1.5% PITI, 28/36% DTI qualifying income, conforming/high-balance/jumbo cliff) and Entry (<0.85x) / Core (0.85–1.35x) / Upper (>1.35x) ZIP median liquidity segmentation."
domain: valuation
domains:
  - valuation
  - market_trends
driver: native_adapter
proto_message_type: "openestate.extension.v1.MarketValuationProto"
priority: 245
enabled_by_default: true
tier: basic
license_class: public_open_data
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
    - external_api_calls
    - bytes_downloaded
builtin: true
provenance: live_verified
homepage_url: "https://www.freddiemac.com/pmms"
documentation_url: "https://www.fhfa.gov/data/conforming-loan-limit"
codeowners:
  - "@openestate/valuation"
geo_scope:
  country: "US"
  nationwide: true
  states: []
  counties: []
  zip_prefixes: []
  zip_codes: []
  cities: []
auth:
  auth_type: none
rate_limit:
  requests_per_second: 5
  burst: 10
  timeout_ms: 8000
  max_retries: 1
cache_ttl_secs: 86400
sharing:
  scope: zip
  ttl_secs: 86400
  stale_while_revalidate_secs: 21600
  background_refresh: true
source_attribution:
  name: "Freddie Mac Primary Mortgage Market Survey (PMMS) & FHFA Conforming Loan Limits"
  url: "https://www.freddiemac.com/pmms"
  reference_url_template: "https://www.freddiemac.com/pmms"
  schedule_or_version: "Weekly PMMS History CSV + 2026 FHFA County Loan Limits"
  notes: "Fetches live Freddie Mac PMMS direct CSV (with FRED MORTGAGE30US fallback) and never fabricates mortgage rates or home prices when offline."

id: ev_fast_chargers_electrification
name: "Public EV DC Fast Chargers & Home Electrification Economics"
version: "1.0.0"
description: "Zero-bottleneck keyless USDOT BTS / DOE AFDC public EV charging stations (NACS, CCS, CHAdeMO, J1772) enriched with Esri OSM charging amenities and optional BYOK developer.nlr.gov API, fused with 5-year HDD65/CDD65 climate normals, local electric/gas tariffs, and 200A panel / load-splitter readiness."
domain: livability
domains:
  - livability
  - electric_utility
  - property_facts
driver: native_adapter
proto_message_type: "openestate.extension.v1.LivabilitySummaryProto"
priority: 245
enabled_by_default: true
tier: basic
license_class: public_open_data
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
    - external_api_calls
    - bytes_downloaded
builtin: true
provenance: live_verified
homepage_url: "https://afdc.energy.gov/stations"
documentation_url: "https://developer.nlr.gov/docs/transportation/alt-fuel-stations-v1/"
codeowners:
  - "@openestate/livability"
geo_scope:
  country: "US"
  nationwide: true
  states: []
  counties: []
  zip_prefixes: []
  zip_codes: []
  cities: []
auth:
  auth_type: api_key_query
  query_param: "api_key"
  env_var: "NREL_API_KEY"
  optional_key: true
rate_limit:
  requests_per_second: 5
  burst: 10
  timeout_ms: 8000
  max_retries: 1
cache_ttl_secs: 1209600
sharing:
  scope: geohash6
  ttl_secs: 1209600
  stale_while_revalidate_secs: 86400
  background_refresh: false
source_attribution:
  name: "U.S. DOT Bureau of Transportation Statistics / U.S. DOE Alternative Fuels Data Center (AFDC)"
  url: "https://afdc.energy.gov/stations"
  reference_url_template: "https://afdc.energy.gov/stations#/find/nearest?location={{lat}},{{lon}}&fuel=ELEC"

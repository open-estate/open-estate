id: rainfall_climatology
name: "NOAA / NASA Rainfall Climatology, Atlas 14 Design Storms & Live QPE/QPF"
version: "1.0.0"
description: "Keyless NASA POWER 25-year rainfall climatology, NOAA Atlas 14 PFDS design storm depths (with RCC-ACIS PRISM/station fallback for WA/OR/ID/MT/WY), 30-year normals & historical peak storms, NOAA RFC multi-sensor observed QPE (24h–WYTD), WPC 7-day QPF, and Flash Flood Guidance."
domain: natural_hazards
domains:
  - natural_hazards
driver: native_adapter
proto_message_type: "openestate.extension.v1.HazardSummaryProto"
priority: 222
enabled_by_default: true
tier: basic
license_class: public_open_data
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
    - external_api_calls
    - bytes_downloaded
builtin: true
provenance: live_verified
homepage_url: "https://hdsc.nws.noaa.gov/pfds/"
documentation_url: "https://power.larc.nasa.gov/docs/services/api/temporal/climatology/"
codeowners:
  - "@openestate/core"
geo_scope:
  country: "US"
  nationwide: true
  states: []
  counties: []
  zip_prefixes: []
  zip_codes: []
  cities: []
auth:
  auth_type: none
rate_limit:
  requests_per_second: 4
  burst: 8
  timeout_ms: 8500
  max_retries: 1
cache_ttl_secs: 3600
sharing:
  scope: geohash5
  ttl_secs: 3600
  stale_while_revalidate_secs: 1800
  background_refresh: false
source_attribution:
  name: "NOAA Atlas 14 PFDS / RCC-ACIS / RFC QPE / NASA POWER"
  url: "https://hdsc.nws.noaa.gov/pfds/"
  reference_url_template: "https://hdsc.nws.noaa.gov/pfds/"

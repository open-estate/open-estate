id: municipal_open_data_permits
name: "Municipal Socrata & Open-Data Building Permits"
version: "1.0.0"
description: "Keyless Stage-1 fetcher querying municipal open-data permit & code-violation Socrata/ArcGIS APIs across supported US jurisdictions (San Francisco, New York City, Seattle, Chicago, Austin, Los Angeles, Denver, etc.)."
domain: permits
domains:
  - permits
driver: native_adapter
proto_message_type: "openestate.extension.v1.PermitsHistoryProto"
priority: 350
enabled_by_default: true
tier: basic
license_class: public_open_data
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
    - external_api_calls
    - bytes_downloaded
builtin: true
provenance: live_verified
homepage_url: "https://data.sfgov.org/"
documentation_url: "https://dev.socrata.com/"
codeowners:
  - "@openestate/permits"
geo_scope:
  country: "US"
  nationwide: true
  states: []
auth:
  auth_type: none
rate_limit:
  requests_per_second: 5
  burst: 10
  timeout_ms: 8000
  max_retries: 1
cache_ttl_secs: 86400
sharing:
  scope: parcel
  ttl_secs: 86400
  stale_while_revalidate_secs: 21600
  background_refresh: false
  key_fields:
    - "parent_address"
source_attribution:
  name: "US Municipal Open-Data Permit Portals (Socrata / ArcGIS)"
  url: "https://data.sfgov.org/"
  notes: "Executes city-specific open-data permit queries cleanly without cross-city fallback confusion."

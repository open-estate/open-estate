id: fcc_mobile_5g
name: "FCC Broadband Data Collection — 5G-NR & 4G LTE Mobile Coverage"
version: "1.0.0"
description: "Federal Communications Commission Broadband Data Collection (BDC) H3 Resolution-8 mobile wireless 5G-NR (35/3 Mbps & 7/1 Mbps) and 4G LTE (5/1 Mbps) outdoor stationary vs. in-vehicle mobile coverage and modeled outdoor minimum RSRP threshold across AT&T, T-Mobile, and Verizon."
domain: broadband
domains:
  - broadband
  - livability
driver: native_adapter
proto_message_type: "openestate.extension.v1.BroadbandCatalogProto"
priority: 265
enabled_by_default: true
tier: basic
license_class: public_open_data
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
    - external_api_calls
    - bytes_downloaded
builtin: true
provenance: live_verified
homepage_url: "https://broadbandmap.fcc.gov/"
documentation_url: "https://www.fcc.gov/BroadbandData"
codeowners:
  - "@openestate/connectivity"
geo_scope:
  country: "US"
  nationwide: true
  states: []
  counties: []
  zip_prefixes: []
  zip_codes: []
  cities: []
auth:
  auth_type: none
rate_limit:
  requests_per_second: 5
  burst: 10
  timeout_ms: 6000
  max_retries: 1
cache_ttl_secs: 604800
sharing:
  scope: geohash6
  ttl_secs: 2592000
  stale_while_revalidate_secs: 604800
  background_refresh: true
source_attribution:
  name: "FCC National Broadband Map — Mobile Wireless Broadband Data Collection (H3 Res-8)"
  url: "https://broadbandmap.fcc.gov/"
  reference_url_template: "https://broadbandmap.fcc.gov/location-summary/mobile?latlon={{lat}}%2C{{lon}}"
  schedule_or_version: "FCC BDC Semi-Annual Mobile Wireless Availability (H3 Resolution 8)"
  notes: "Evaluates keyless FCC Mobile BDC H3 Resolution-8 hexagons for AT&T, T-Mobile, and Verizon 4G LTE (5/1), 5G-NR (7/1), and 5G-NR (35/3) outdoor stationary vs. in-vehicle coverage and FCC BDC modeled outdoor minimum RSRP thresholds (dBm) — never indoor signal bars."

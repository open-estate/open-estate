id: osrm_routing
name: "Self-Hosted OSRM Multi-Modal Routing Matrix"
version: "1.1.0"
description: "Primary Tier-1 self-hosted OSRM road-network driving, walking, and cycling table service (configured via OSRM_REGIONS_JSON, OSRM_BASE_URL, OSRM_FOOT_BASE_URL, and OSRM_BIKE_BASE_URL; public demo routers project-osrm.org and routing.openstreetmap.de are never called) plus Esri OSM_NA_Trails sidewalk/bikeway corridor verification for assigned schools, nearest 24/7 ER, and parks."
domain: routing
domains:
  - routing
  - livability
  - schools
driver: openapi_yaml
proto_message_type: "openestate.extension.v1.RoutingMatrixProto"
priority: 200
enabled_by_default: true
tier: basic
license_class: public_open_data
execution_mode: eager
requires_manual_approval: false
min_plan_tier: ""
metering:
  dimensions:
    - invocations
    - wall_time_ms
    - external_api_calls
    - bytes_downloaded
provenance: live_verified
homepage_url: "https://project-osrm.org/"
documentation_url: "https://project-osrm.org/docs/v5.24.0/api/#table-service"
codeowners:
  - "@openestate/core"
geo_scope:
  country: "US"
  nationwide: true
auth:
  type: none
  env_var: "OSRM_REGIONS_JSON"
  optional_key: true
rate_limit:
  requests_per_second: 50
  burst: 100
  timeout_ms: 8000
  max_retries: 0
cache_ttl_secs: 604800
sharing:
  scope: geohash7
  ttl_secs: 2592000
  stale_while_revalidate_secs: 86400
  background_refresh: false
  key_fields:
    - "extra_params.profile"
source_attribution:
  name: "OpenStreetMap road & trail network (self-hosted OSRM + OSM_NA_Trails)"
  url: "https://project-osrm.org/"
  reference_url_template: "https://project-osrm.org/"
  notes: "Supports driving, foot, and bike OSRM profiles on self-hosted endpoints only; public demo hosts project-osrm.org and routing.openstreetmap.de are strictly blocked."
openapi:
  spec_file: "openapi.yaml"
  operation_id: "getOsrmDrivingTable"
response_mapping:
  root_path: "$"
  require_non_empty: true
  fields:
    sample_duration_sec: "$.durations[0][1]"
    sample_distance_m: "$.distances[0][1]"

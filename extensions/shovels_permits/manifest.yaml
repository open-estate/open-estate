id: shovels_permits
name: "Shovels v2 Nationwide Building Permits"
version: "1.0.0"
description: "Stage-1 two-step Shovels v2 REST permit fetcher (/v2/addresses/search -> geo_id -> /v2/permits/search) resolving standardized permit and contractor history nationwide when SHOVELS_API_KEY is configured."
domain: permits
domains:
  - permits
driver: native_adapter
proto_message_type: "openestate.extension.v1.PermitsHistoryProto"
priority: 300
enabled_by_default: true
builtin: true
provenance: live_verified
homepage_url: "https://www.shovels.ai/"
documentation_url: "https://api.shovels.ai/v2/docs"
codeowners:
  - "@openestate/permits"
geo_scope:
  country: "US"
  nationwide: true
  states: []
auth:
  auth_type: api_key_header
  header_name: "X-API-Key"
  env_var: "SHOVELS_API_KEY"
  optional_key: true
rate_limit:
  requests_per_second: 5
  burst: 10
  timeout_ms: 8000
  max_retries: 1
cache_ttl_secs: 86400
source_attribution:
  name: "Shovels v2 Building Permit & Contractor Registry API"
  url: "https://api.shovels.ai/v2/addresses/search"
  notes: "Skipped cleanly when SHOVELS_API_KEY is unset; never fabricates placeholder permits."

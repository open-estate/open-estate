id: county_recorder_liens
name: "NYC ACRIS Recorded Instrument Index (Socrata Zero-PII)"
version: "1.0.0"
description: "Keyless New York City ACRIS Real Property Legals open-data clerk/recorder index connector (strictly scoped to NYC's 5 boroughs) with strict zero-PII owner/borrower redaction."
domain: property_facts
domains:
  - property_facts
  - tax_mandates
driver: declarative_yaml
proto_message_type: "openestate.extension.v1.PropertyFactsProto"
priority: 215
enabled_by_default: true
builtin: true
provenance: live_verified
homepage_url: "https://data.cityofnewyork.us/City-Government/ACRIS-Real-Property-Legals/8h5j-fqxa"
documentation_url: "https://dev.socrata.com/foundry/data.cityofnewyork.us/8h5j-fqxa"
codeowners:
  - "@openestate/core"
geo_scope:
  country: "US"
  states: ["NY"]
  counties: ["36005", "36047", "36061", "36081", "36085"]
  zip_prefixes: []
  zip_codes: []
  cities: []
auth:
  auth_type: none
  optional_key: true
rate_limit:
  requests_per_second: 4
  burst: 8
  timeout_ms: 4000
  max_retries: 1
cache_ttl_secs: 86400
source_attribution:
  name: "NYC Department of Finance ACRIS Real Property Legals (Zero-PII Document Index)"
  url: "https://data.cityofnewyork.us/resource/8h5j-fqxa.json"
  schedule_or_version: "Socrata SODA v2.1 Zero-PII Document Index"
  notes: "Strictly NYC boroughs only; indexes recorded instrument street matches without overwriting assessor APN or exposing personal party names."
request:
  method: "GET"
  url: "https://data.cityofnewyork.us/resource/8h5j-fqxa.json"
  query_params:
    "$limit": "5"
    "$q": "{{ street }}"
response_mapping:
  root_path: "$[0]"
  require_non_empty: true
  fields:
    street: "$.street_name"

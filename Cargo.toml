[package]
name = "open-estate"
version = "1.0.0"
edition = "2021"
license-file = "LICENSE"
publish = false
description = "Open Estate — Personal Single-User Self-Hosted US Home Research & AI Home Finder Server"
default-run = "open-estate-server"

[lib]
name = "open_estate"
path = "src/lib.rs"

[[bin]]
name = "open-estate-server"
path = "src/main.rs"

[dependencies]
# Web & Async Runtime (MIT)
axum = { version = "0.7", features = ["macros", "json", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-full", "limit", "cors", "trace"] }
futures = "0.3"

# HTTP Client, URL & Exponential Backoff Retries (MIT / Apache-2.0)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "stream", "socks"] }
url = "2.5"
urlencoding = "2"
backon = "1.6"

# Database & Dynamic SQL Builder — SQLite WAL + MySQL 8/9 (MIT / Apache-2.0)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "mysql", "chrono", "macros"] }
sea-query = "1.0"

# Concurrent TTL Cache & GCRA Rate Limiting (MIT / Apache-2.0)
moka = { version = "0.12", features = ["future", "sync"] }
dashmap = "6"
governor = "0.10"

# Geospatial, GeoJSON & NOAA WMM2025 Geomagnetism (MIT / Apache-2.0)
geo = "0.33"
geojson = { version = "1.0", features = ["geo-types"] }
world_magnetic_model = "1.2025"
las = { version = "0.11", features = ["laz"] }

# PDF Parsing, Text Extraction & Zstandard Compression (MIT / BSD)
lopdf = "0.47"
pdf-extract = "0.12"
flate2 = "1"
zstd = "0.14"

# Templating, HTML Escaping, i18n (Fluent), CSV & Slug (MIT / Apache-2.0)
minijinja = { version = "3.1", features = ["builtins"] }
html-escape = "0.3"
fluent-templates = "0.15"
unic-langid = "0.9"
csv = "1"
slug = "0.1"

# Async SMTP & MIME Email (MIT)
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport", "hostname"] }

# CLI, Env, Serialization, Crypto & Observability (MIT / Apache-2.0)
clap = { version = "4.6", features = ["derive", "env"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
openapiv3 = "2.2"
serde_json_path = "0.7"
prost = "0.14"
prost-types = "0.14"
regex = "1"
once_cell = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
prost-build = "0.14"
protox = "0.10"

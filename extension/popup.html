<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Property &amp; Deal Room Intelligence</title>
  <style>
    :root {
      --brand: #0f766e;
      --brand2: #14b8a6;
      --brandsoft: #f0fdfa;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 380px;
      background: var(--bg);
      color: var(--ink);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 14px;
      flex: 0 0 auto;
    }
    .logo.has-mark { background: none; }
    .logo svg { width: 100%; height: 100%; display: block; }
    .brand-title { font-weight: 800; font-size: 14.5px; letter-spacing: -0.2px; }
    .srv-dot {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }
    .srv-dot i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94a3b8;
      display: inline-block;
    }
    .srv-dot.ok i { background: #16a34a; }
    .srv-dot.err i { background: #dc2626; }
    .hdr-right { display: flex; align-items: center; gap: 6px; }
    .pill-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: #334155;
      border-radius: 999px;
      padding: 4px 9px;
      font: 700 11px/1.2 inherit;
      cursor: pointer;
    }
    .pill-btn:hover { border-color: var(--brand); color: var(--brand); }
    main { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
    }
    .sec-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .lookup-row { display: flex; gap: 6px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      font: inherit;
      color: var(--ink);
      outline: none;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.14);
    }
    .btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 11px;
      font: 700 12px/1.25 inherit;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn:hover { border-color: var(--brand); background: var(--brandsoft); }
    .btn.pri { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn.pri:hover { filter: brightness(0.95); background: var(--brand); }
    .btn.full { width: 100%; margin-top: 8px; padding: 8px 12px; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .preset-row { display: flex; gap: 6px; margin-top: 6px; }
    .preset-row .btn { flex: 1; font-size: 11px; padding: 5px 8px; }
    .shortlist { display: flex; flex-direction: column; gap: 6px; max-height: 210px; overflow-y: auto; }
    .dr-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 9px;
      border: 1px solid #f1f5f9;
      background: #f8fafc;
      border-radius: 9px;
    }
    .dr-addr {
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dr-meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .score-chip {
      font-weight: 800;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #ecfdf5;
      color: #065f46;
      white-space: nowrap;
    }
    .rm-btn {
      border: 0;
      background: transparent;
      color: #94a3b8;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      padding: 0 3px;
    }
    .rm-btn:hover { color: #dc2626; }
    .empty { font-size: 12px; color: var(--muted); text-align: center; padding: 10px 4px; }
    details summary {
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      color: #334155;
      list-style: none;
    }
    details summary::-webkit-details-marker { display: none; }
    .field { margin-top: 8px; }
    .field label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 3px; }
    .status-note { font-size: 11.5px; margin-top: 6px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo" id="brandLogo"></div>
      <div>
        <div class="brand-title" id="brandName"></div>
        <div class="srv-dot" id="srvStatus"><i></i><span id="srvStatusText">Checking…</span></div>
      </div>
    </div>
    <div class="hdr-right">
      <button type="button" class="pill-btn" id="langBtn" title="EN / 中文 / ES">🌐 EN</button>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="sec-title">
        <span id="lblLookup">Quick US Address Lookup</span>
      </div>
      <form class="lookup-row" id="lookupForm">
        <input type="text" id="addrInput" placeholder="Enter US street address, city, state &amp; ZIP" autocomplete="off">
        <button type="submit" class="btn pri" id="analyzeBtn">Analyze</button>
      </form>
      <div id="lookupResult" style="display:none;margin-top:9px"></div>
    </section>

    <section class="card">
      <div class="sec-title">
        <span id="lblDealRoom">Deal Room Shortlist (0/10)</span>
        <button type="button" class="pill-btn" id="clearDealRoomBtn" style="padding:2px 7px;font-size:10.5px">Clear</button>
      </div>
      <div class="shortlist" id="dealRoomList"></div>
      <button type="button" class="btn pri full" id="compareBtn" disabled>Compare Side-by-Side in Deal Room ↗</button>
    </section>

    <details class="card" id="settingsBox">
      <summary id="lblSettings">⚙️ Server &amp; White-Label Settings</summary>
      <div class="field">
        <label for="srvUrlInput" id="lblSrvUrl">Backend Server URL</label>
        <input type="text" id="srvUrlInput" placeholder="">
        <div class="preset-row">
          <button type="button" class="btn" id="useProdBtn"></button>
          <button type="button" class="btn" id="useDevBtn"></button>
        </div>
      </div>
      <div class="field">
        <label for="apiKeyInput" id="lblApiKey">API / Batch Token (optional)</label>
        <input type="password" id="apiKeyInput" placeholder="">
      </div>
      <div style="display:grid;grid-template-columns:1fr 96px;gap:8px" class="field">
        <div>
          <label for="wlNameInput" id="lblWlName">White-Label Brand Name</label>
          <input type="text" id="wlNameInput" placeholder="">
        </div>
        <div>
          <label for="wlColorInput" id="lblWlColor">Accent Hex</label>
          <input type="text" id="wlColorInput" placeholder="">
        </div>
      </div>
      <button type="button" class="btn pri full" id="saveSettingsBtn">Test &amp; Save Settings</button>
      <div class="status-note" id="settingsNote"></div>
    </details>
  </main>

  <script src="vendor/i18next.min.js"></script>
  <script src="locales/resources.js"></script>
  <script src="i18n.js"></script>
  <script src="brand.js"></script>
  <script src="popup.js"></script>
</body>
</html>

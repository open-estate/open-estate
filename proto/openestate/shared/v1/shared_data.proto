syntax = "proto3";

package openestate.shared.v1;

import "openestate/extension/v1/domains.proto";
import "openestate/extension/v1/extension.proto";

// WGS84 geographic bounding box for tile/cell indexing.
message GeoBoundingBoxProto {
  double south = 1;
  double west = 2;
  double north = 3;
  double east = 4;
}

// Registry descriptor for each globally shared dataset (`shared_datasets` table).
message SharedDatasetDescriptorProto {
  string dataset_id = 1;
  string payload_message_type = 2;
  openestate.extension.v1.ShareScope scope = 3;
  uint64 ttl_secs = 4;
  uint64 stale_while_revalidate_secs = 5;
  bool background_refresh = 6;
  optional string schedule_ref = 7;
  optional string owner_extension_id = 8;
  uint32 schema_version = 9;
  string description = 10;
  bool binary_blob_backed = 11;
}

// Envelope persisted in `shared_data_records` with typed spatial index columns & provenance.
message SharedDataRecordProto {
  string dataset_id = 1;
  uint32 schema_version = 2;
  openestate.extension.v1.ShareScope scope = 3;
  string scope_key = 4;
  string params_hash = 5;
  optional string geohash5 = 6;
  optional string geohash6 = 7;
  optional string geohash7 = 8;
  optional string tract = 9;
  optional string zip = 10;
  optional string county = 11;
  optional string state = 12;
  optional GeoBoundingBoxProto bbox = 13;
  bytes payload = 14;
  string content_hash = 15;
  optional string blob_hash = 16;
  optional openestate.extension.v1.SourceAttributionProto provenance = 17;
  int64 fetched_at = 18;
  int64 expires_at = 19;
  optional string payload_json = 20;
  uint64 hit_count = 21;
  optional string provenance_json = 22;
}

// Dataset: `rental_listings` — batch of normalized cross-source rental listings in a shared cell.
message SharedRentalListingsProto {
  string scope_key = 1;
  repeated openestate.extension.v1.RentalListingProto listings = 2;
  string fetched_at_rfc3339 = 3;
}

// Dataset: `rental_market_cells` — aggregated market statistics cell.
message SharedRentalMarketCellsProto {
  string geo_key = 1;
  repeated openestate.extension.v1.RentalMarketCellProto cells = 2;
  string refreshed_at_rfc3339 = 3;
}

// Individual hazard zone polygon entry inside `HazardPolygonTileProto`.
message HazardPolygonFeatureProto {
  string layer = 1; // e.g., "fema_nfhl", "cgs_liquefaction", "cgs_landslide", "calfire_fhsz", "dam_inundation"
  string zone_code = 2;
  string label = 3;
  bool high_hazard = 4;
  GeoBoundingBoxProto bbox = 5;
  // Simplified GeoJSON geometry string or ring coordinates tested locally per parcel.
  string geometry_geojson = 6;
  map<string, string> attributes = 7;
}

// Dataset: `hazard_polygon_tile` — FEMA flood, CGS seismic/landslide, CAL FIRE, and dam inundation polygons per tile/geohash5.
message HazardPolygonTileProto {
  string tile_key = 1;
  string layer = 2;
  GeoBoundingBoxProto bbox = 3;
  repeated HazardPolygonFeatureProto features = 4;
  optional string blob_hash = 5;
  string source_name = 6;
  string source_url = 7;
  string fetched_at_rfc3339 = 8;
}

// Individual Quaternary fault trace segment.
message FaultLineFeatureProto {
  string fault_id = 1;
  string fault_name = 2;
  string slip_rate = 3;
  string age_class = 4;
  bool alquist_priolo = 5;
  // Encoded GeoJSON LineString/MultiLineString coordinates for local distance testing.
  string geometry_geojson = 6;
}

// Dataset: `fault_lines` — USGS Quaternary / CGS fault lines per tile or geohash5.
message FaultLinesTileProto {
  string tile_key = 1;
  GeoBoundingBoxProto bbox = 2;
  repeated FaultLineFeatureProto faults = 3;
  string source_url = 4;
  string fetched_at_rfc3339 = 5;
}

// Dataset: `tract_indicators` — census-tract FEMA NRI, CalEnviroScreen, Census ACS, and EPA EJScreen metrics.
message TractIndicatorsProto {
  string tract_geoid = 1;
  string state_fips = 2;
  string county_fips = 3;
  optional double nri_composite_score = 4;
  optional string nri_composite_rating = 5;
  map<string, double> nri_hazard_scores = 6;
  optional double calenviroscreen_percentile = 7;
  optional double calenviroscreen_pollution_percentile = 8;
  optional double ejscreen_pm25_percentile = 9;
  optional double ejscreen_traffic_percentile = 10;
  optional int64 acs_median_household_income_usd = 11;
  optional int64 acs_median_home_value_usd = 12;
  optional int64 acs_median_gross_rent_usd = 13;
  optional double acs_broadband_adoption_pct = 14;
  optional double acs_owner_occupied_pct = 15;
  string vintage = 16;
  string fetched_at_rfc3339 = 17;
}

// Individual school attendance / metric entry inside `SchoolDistrictZoneProto`.
message SchoolMetricEntryProto {
  string nces_id = 1;
  string name = 2;
  string level = 3; // "elementary" | "middle" | "high" | "combined"
  optional double ela_pct = 4;
  optional double math_pct = 5;
  optional double combined_pct = 6;
  optional double state_percentile = 7;
  optional double student_teacher_ratio = 8;
  optional double lat = 9;
  optional double lon = 10;
  string metric_source = 11;
  uint32 metric_year = 12;
}

// Dataset: `school_district_metrics` — NCES school district, attendance zones, and academic metrics.
message SchoolDistrictZoneProto {
  string district_geoid = 1;
  string district_name = 2;
  string state = 3;
  optional string attendance_boundary_geojson = 4;
  repeated SchoolMetricEntryProto schools = 5;
  string fetched_at_rfc3339 = 6;
}

// Dataset: `crime_stats` — FBI CDE agency / city crime rates and multi-year trend records.
message CrimeStatsProto {
  string jurisdiction_key = 1;
  string ori = 2;
  string agency_name = 3;
  string city = 4;
  string state = 5;
  uint32 latest_year = 6;
  optional double violent_crime_per_100k = 7;
  optional double property_crime_per_100k = 8;
  optional double crime_safety_score = 9;
  map<string, double> category_rates_per_100k = 10;
  string source_name = 11;
  string source_url = 12;
  string fetched_at_rfc3339 = 13;
}

// Amenity POI summary entry inside `AmenityCellProto`.
message AmenityPoiSummaryProto {
  string category = 1;
  string name = 2;
  double lat = 3;
  double lon = 4;
  optional string osm_id = 5;
}

// Dataset: `amenities_cell` — geohash-6 Overpass / ArcGIS POI counts and infrastructure vectors.
message AmenityCellProto {
  string geohash6 = 1;
  GeoBoundingBoxProto bbox = 2;
  map<string, uint32> category_counts = 3;
  repeated AmenityPoiSummaryProto pois = 4;
  optional double walkability_index = 5;
  string source_name = 6;
  string fetched_at_rfc3339 = 7;
}

// Dataset: `noise_tile` — US DOT/BTS 24-hour transportation noise tile reference/grid.
message NoiseTileProto {
  string tile_key = 1;
  uint32 zoom = 2;
  uint32 tile_x = 3;
  uint32 tile_y = 4;
  GeoBoundingBoxProto bbox = 5;
  optional double mean_road_dba = 6;
  optional double mean_aviation_dba = 7;
  optional double mean_rail_dba = 8;
  optional string blob_hash = 9;
  string source_url = 10;
  string fetched_at_rfc3339 = 11;
}

// Dataset: `air_quality_cell` — 0.1-deg / geohash-5 Open-Meteo CAMS & AirNow AQI / PM2.5 cell.
message AirQualityCellProto {
  string grid_key = 1;
  double center_lat = 2;
  double center_lon = 3;
  optional int32 current_us_aqi = 4;
  optional double pm25_mean_30d_ug_m3 = 5;
  optional double pm10_mean_30d_ug_m3 = 6;
  optional double ozone_mean_30d = 7;
  optional int32 unhealthy_days_30d = 8;
  string source_url = 9;
  string fetched_at_rfc3339 = 10;
}

// Dataset: `climate_normals_cell` — 0.1-deg climate normals, HDD/CDD degree-days, and precipitation.
message ClimateNormalsCellProto {
  string grid_key = 1;
  double center_lat = 2;
  double center_lon = 3;
  optional double annual_mean_temp_f = 4;
  optional double july_high_temp_f = 5;
  optional double jan_low_temp_f = 6;
  optional double annual_precip_inches = 7;
  optional double heating_degree_days_65f = 8;
  optional double cooling_degree_days_65f = 9;
  string normal_period = 10;
  string source_url = 11;
  string fetched_at_rfc3339 = 12;
}

// Dataset: `utility_territory` — electric, gas, water, or sanitation service territory mapping.
message UtilityTerritoryProto {
  string service_kind = 1; // "electric" | "gas" | "water" | "sewer" | "trash"
  string geo_key = 2;
  string carrier_name = 3;
  string short_name = 4;
  string utility_type = 5;
  optional string cca_program = 6;
  optional string pwsid = 7;
  optional string boundary_geojson = 8;
  string source_name = 9;
  string source_url = 10;
  string fetched_at_rfc3339 = 11;
}

// Dataset: `utility_tariff` — global per-utility residential rate schedule & tariff table.
message UtilityTariffTableProto {
  string utility_id = 1;
  string service_kind = 2; // "electric" | "gas" | "water" | "sewer" | "trash"
  string carrier_name = 3;
  string rate_schedule = 4;
  optional double rate_per_kwh_usd = 5;
  optional double off_peak_kwh_usd = 6;
  optional double peak_kwh_usd = 7;
  optional double rate_per_therm_usd = 8;
  optional double volumetric_water_rate_usd = 9;
  optional string water_rate_unit = 10;
  double monthly_base_fee_usd = 11;
  optional string solar_nem_policy = 12;
  string tariff_url = 13;
  string effective_date = 14;
  string fetched_at_rfc3339 = 15;
}

// Dataset: `broadband_hex` — FCC BDC H3 hex / census block fixed & 5G carrier coverage.
message BroadbandHexProto {
  string hex_or_block_id = 1;
  string scope_kind = 2; // "h3_r8" | "census_block" | "geohash7"
  repeated openestate.extension.v1.BroadbandOptionProto carriers = 3;
  int64 max_download_mbps = 4;
  int64 max_upload_mbps = 5;
  bool fiber_present = 6;
  string bdc_vintage = 7;
  string source_url = 8;
  string fetched_at_rfc3339 = 9;
}

// Individual planning/entitlement/rezoning project entry inside `PlanningRadarCellProto`.
message PlanningRadarItemProto {
  string project_id = 1;
  string title = 2;
  string status = 3;
  string category = 4;
  optional string address = 5;
  optional double lat = 6;
  optional double lon = 7;
  optional int32 proposed_units = 8;
  optional string filed_date = 9;
  optional string source_url = 10;
}

// Dataset: `planning_radar_cell` — geohash-6 planning, rezoning, and major construction projects.
message PlanningRadarCellProto {
  string geohash6 = 1;
  repeated PlanningRadarItemProto projects = 2;
  string source_name = 3;
  string source_url = 4;
  string fetched_at_rfc3339 = 5;
}

// Dataset: `city_permit_dataset` — city-scoped permit portal dataset page/batch.
message CityPermitDatasetPageProto {
  string city = 1;
  string state = 2;
  string portal_name = 3;
  string portal_url = 4;
  string page_cursor = 5;
  repeated openestate.extension.v1.PermitRecordProto permits = 6;
  bool complete = 7;
  string fetched_at_rfc3339 = 8;
}

// Dataset: `market_trend` — ZIP/county housing market trends & sales-comp pool benchmarks.
message MarketTrendCellProto {
  string geo_key = 1; // e.g. "zip:95008", "county:06085"
  string geo_kind = 2;
  optional int64 median_sale_price_usd = 3;
  optional double median_price_per_sqft_usd = 4;
  optional int32 median_days_on_market = 5;
  optional int32 active_inventory = 6;
  optional double yoy_appreciation_pct = 7;
  optional double cagr_5yr_pct = 8;
  optional int32 sales_comp_count = 9;
  string period_label = 10;
  string source_name = 11;
  string source_url = 12;
  string fetched_at_rfc3339 = 13;
}

// Dataset: `mortgage_rate` — global Freddie Mac PMMS / Treasury mortgage benchmark snapshot.
message MortgageRateSnapshotProto {
  string as_of_date = 1;
  double rate_30yr_fixed_pct = 2;
  optional double rate_15yr_fixed_pct = 3;
  optional double rate_5yr_arm_pct = 4;
  optional double jumbo_30yr_pct = 5;
  optional double treasury_10yr_pct = 6;
  string source_name = 7;
  string source_url = 8;
  string fetched_at_rfc3339 = 9;
}

// Dataset: `tax_rate_area` — county/city property tax rate area & special district assessments.
message TaxRateAreaProto {
  string state = 1;
  string county_fips = 2;
  optional string city = 3;
  optional string tra_code = 4;
  double base_ad_valorem_pct = 5;
  double effective_property_tax_rate = 6;
  bool has_special_tax_district = 7;
  optional string special_tax_district_label = 8;
  optional string homestead_exemption_summary = 9;
  repeated string point_of_sale_mandates = 10;
  string source_url = 11;
  string fetched_at_rfc3339 = 12;
}

// Dataset: `transfer_tax_table` — state/county/city documentary transfer tax schedule.
message TransferTaxTableProto {
  string state = 1;
  optional string county_fips = 2;
  optional string city = 3;
  double state_transfer_tax_pct = 4;
  double county_transfer_tax_pct = 5;
  double city_transfer_tax_pct = 6;
  string custom_payer_split = 7;
  string source_url = 8;
  string fetched_at_rfc3339 = 9;
}

// Dataset: `title_underwriter_rates` — state statutory/filed/benchmark title insurance rate table.
message TitleRateTableProto {
  string state = 1;
  string filing_regime = 2; // "promulgated_statutory" | "rating_bureau_filed" | "benchmark"
  double base_rate_per_1k_usd = 3;
  optional double reissue_discount_pct = 4;
  optional double simultaneous_issue_fee_usd = 5;
  string rate_tiers_json = 6;
  string source_name = 7;
  string source_url = 8;
  string fetched_at_rfc3339 = 9;
}

// Dataset: `insurance_benchmark` — state/county/ZIP property, flood, and earthquake insurance benchmarks.
message InsuranceBenchmarkProto {
  string geo_key = 1;
  string state = 2;
  optional string county_fips = 3;
  optional string zip = 4;
  double effective_pct_of_value = 5;
  optional int64 median_annual_premium_usd = 6;
  optional int64 flood_base_annual_usd = 7;
  optional int64 earthquake_base_annual_usd = 8;
  optional string carrier_market_status = 9;
  string source_name = 10;
  string source_url = 11;
  string fetched_at_rfc3339 = 12;
}

// Single origin-destination entry inside `DriveTimeMatrixProto`.
message DriveTimeEntryProto {
  string destination_id = 1;
  string destination_label = 2;
  double destination_lat = 3;
  double destination_lon = 4;
  double duration_sec = 5;
  double distance_m = 6;
}

// Dataset: `drive_time_matrix` — origin geohash-7 x destination drive/transit matrix.
message DriveTimeMatrixProto {
  string origin_geohash7 = 1;
  double origin_lat = 2;
  double origin_lon = 3;
  string profile = 4; // "driving" | "transit" | "cycling" | "walking"
  string provider_id = 5;
  repeated DriveTimeEntryProto entries = 6;
  string fetched_at_rfc3339 = 7;
}

// Dataset: `imagery_lidar_tile` — satellite ortho or USGS 3DEP LiDAR LAZ tile reference.
message ImageryLidarTileRefProto {
  string tile_key = 1;
  string asset_kind = 2; // "ortho_tile" | "lidar_laz" | "lidar_patch"
  string provider = 3;
  GeoBoundingBoxProto bbox = 4;
  optional double resolution_m = 5;
  optional int32 capture_year = 6;
  string source_url = 7;
  optional string blob_hash = 8;
  optional uint64 byte_size = 9;
  string fetched_at_rfc3339 = 10;
}

// Dataset: `hoa_document_set` — HOA-scoped CC&Rs, budget, reserve study & master insurance shared across units.
message HoaDocumentSetProto {
  string association_name = 1;
  optional string management_company = 2;
  string scope_key = 3;
  optional string city = 4;
  optional string state = 5;
  optional string zip = 6;
  repeated string apns = 7;
  repeated string source_packet_ids = 8;
  repeated openestate.extension.v1.DisclosureFileProto files = 9;
  optional string summary_json = 10;
  bool verified = 11;
  string updated_at = 12;
}

// Dataset: `subdivision_document_set` — builder/tract-level public report, soils & plat docs shared across units.
message SubdivisionDocumentSetProto {
  string subdivision_name = 1;
  optional string tract_number = 2;
  optional string builder_name = 3;
  string scope_key = 4;
  optional string city = 5;
  optional string county = 6;
  optional string state = 7;
  optional string zip = 8;
  repeated string source_packet_ids = 9;
  repeated openestate.extension.v1.DisclosureFileProto files = 10;
  optional string summary_json = 11;
  bool verified = 12;
  string updated_at = 13;
}

// Dataset: `listing_agent_profile` — global listing-agent directory, response history & opt-out status.
message ListingAgentProfileProto {
  string email = 1;
  optional string full_name = 2;
  optional string license_number = 3;
  optional string brokerage = 4;
  optional string phone = 5;
  bool do_not_contact = 6;
  uint32 requests_sent_count = 7;
  uint32 replies_received_count = 8;
  optional string last_contacted_at = 9;
  optional string last_replied_at = 10;
  string updated_at = 11;
}

// Dataset: `neighborhood_narrative` — census-tract / geohash-6 LLM neighborhood narrative & provenance.
message NeighborhoodNarrativeProto {
  string scope_key = 1;
  optional string geohash6 = 2;
  optional string tract = 3;
  optional string city = 4;
  optional string state = 5;
  optional string neighborhood_name = 6;
  string summary_en = 7;
  optional string summary_zh = 8;
  optional string summary_es = 9;
  repeated string highlights = 10;
  string model = 11;
  optional string effort = 12;
  string generated_at = 13;
  repeated string tradeoffs = 14;
}
